name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintRelease

      - name: APK sizes
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          ( cd app/build/outputs/apk && find . -name '*.apk' -printf '%s\t%p\n' \
            | awk -F'\t' '{printf "- `%s` — %.1f MB\n", $2, $1/1048576}' ) >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: justpdf-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
