name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach APKs to (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing config
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing secrets set — release APKs will be debug-signed."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/justpdf-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/justpdf-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir dist
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "dist/$(basename "$f")"
          done
          ls -lh dist

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties keystore/justpdf-release.jks

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: JustPDF ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Sideload build. Grab the APK for your phone's architecture — almost
            always **arm64-v8a**. If unsure, use the `universal` APK.

            The `*-release.apk` files are signed with the project's release key
            (SHA-256 `4656b81069ead7e7df7e87d2ad64990f9e34a3ed1eff56d925c17e98f5b16a61`).
            The `*-debug.apk` files are debug-signed and only for quick testing.
          files: dist/*.apk
